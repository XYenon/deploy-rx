[package]
name = "deploy-rx"
version = "0.1.0"
authors = ["notgne2 <gen2@gen2.space>", "Serokell <hi@serokell.io>", "XYenon <i@xyenon.bid>"]
edition = "2018"
resolver = "3"
rust-version = "1.95"
description = "An extended multi-profile Nix-flake deployment tool."
license = "MPL-2.0"
repository = "https://github.com/XYenon/deploy-rx"
readme = "README.md"
keywords = ["nix", "flake", "deployment", "ssh", "operations"]
categories = ["command-line-utilities", "development-tools"]
# Keep nix/transform-deploy.nix, which src/cli.rs embeds at compile time.
exclude = [
    ".agents/",
    ".envrc",
    ".github/",
    ".gitignore",
    ".reuse/",
    "default.nix",
    "docs/",
    "examples/",
    "flake.lock",
    "flake.nix",
    "interface.json",
    "nix/tests/",
    "renovate.json",
    "shell.nix",
    # These integration tests require the repository's flake and Nix fixtures.
    "tests/",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = [ "wrap_help", "derive" ] }
clap_complete = "4"
dirs = "7"
flexi_logger = "0.31"
fork = "0.11"
futures-util = "0.3.31"
libc = "0.2"
log = "0.4"
merge = "0.2.0"
rnix = "0.15"
serde = { version = "1.0.219", features = [ "derive" ] }
serde_json = "1.0.140"
shlex = "2.0"
signal-hook = "0.4"
thiserror = "2.0"
tokio = { version = "1.44.2", features = [ "process", "macros", "sync", "rt-multi-thread", "fs", "time", "io-util", "io-std" ] }
toml = "1.0"
whoami = "2.0"
yn = "0.1"
rpassword = "7.5.0"
unescape = "0.1.0"
dix = "2.2.0"
tempfile = "3"

[lib]
name = "deploy"
path = "src/lib.rs"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
