[package]
name = "deploy-rx"
version = "0.1.0"
authors = ["notgne2 <gen2@gen2.space>", "Serokell <hi@serokell.io>", "XYenon <i@xyenon.bid>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = [ "wrap_help", "derive" ] }
dirs = "7"
flexi_logger = "0.31"
fork = "0.10"
futures-util = "0.3.31"
log = "0.4"
merge = "0.2.0"
rnix = "0.14"
serde = { version = "1.0.219", features = [ "derive" ] }
serde_json = "1.0.140"
shlex = "2.0"
signal-hook = "0.4"
thiserror = "2.0"
tokio = { version = "1.44.2", features = [ "process", "macros", "sync", "rt-multi-thread", "fs", "time", "io-util" ] }
toml = "1.0"
whoami = "2.0"
yn = "0.1"
rpassword = "7.5.0"
unescape = "0.1.0"
dix = "2.2.0"

[dev-dependencies]
tempfile = "3"

[lib]
name = "deploy"
path = "src/lib.rs"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
