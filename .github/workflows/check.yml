name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run Rust checks
        run: |
          nix develop --command bash -euo pipefail -c '
            cargo fmt --check
            cargo clippy --all-targets -- --deny warnings
            cargo test
          '

  get-matrix:
    name: Get matrix
    runs-on: ubuntu-latest
    outputs:
      check-matrix: ${{ steps.set-check-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@main
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - id: set-check-matrix
        run: |
          matrix="$(
            nix eval --json .#check-matrix.x86_64-linux |
              jq -c '
                [.include[] | select(.check != "clippy" and .check != "rustfmt")] as $checks
                | {
                    include: [
                      range(0; 6) as $shard
                      | {
                          shard: ($shard + 1),
                          checks: [
                            $checks
                            | to_entries[]
                            | select((.key % 6) == $shard)
                            | ".#checks.x86_64-linux.\(.value.check)"
                          ]
                        }
                    ]
                  }
              '
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  check:
    needs: get-matrix
    name: Check shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-matrix.outputs.check-matrix) }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check
        run: nix build -L ${{ join(matrix.checks, ' ') }}
