name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run Rust checks
        run: |
          nix develop --command bash -euo pipefail -c '
            cargo fmt --check
            cargo clippy --all-targets -- --deny warnings
            cargo test
          '

  get-matrix:
    name: Get matrix
    runs-on: ubuntu-latest
    outputs:
      check-matrix: ${{ steps.set-check-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@main
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - id: set-check-matrix
        run: |
          matrix="$(
            nix eval --json .#check-matrix.x86_64-linux |
              jq -c '
                [.include[] | select(.check != "clippy" and .check != "rustfmt")] as $checks
                # Seconds measured in PR #37. Grouped VM checks use the sum of their subtests;
                # non-VM checks add no measured VM runtime when built alongside a VM check.
                | {
                    "activation-modes": 728.99,
                    "deploy-rx": 0,
                    "file-mode-with-flake-capable-nix": 481.77,
                    "flake-build-with-flakes-disabled-in-config": 566.17,
                    "flake-remote-build-with-flakes-disabled-in-config": 368.74,
                    "hyphen-ssh-opts-regression": 370.88,
                    "local-build": 890.08,
                    "multi-host-scenarios": 450.14,
                    "options-overriding": 460.91,
                    "profile": 450.75,
                    "remote-build": 369.07,
                    "reuse": 0,
                    "rollback-scenarios": 1007.33,
                    "ssh-multiplexing": 346.64,
                    "ssh-rollback": 442.89,
                    "transform-deploy": 0
                  } as $weights
                | [$checks[] | select($weights[.check] != null) | . + {weight: $weights[.check]}] as $weighted
                | [$checks[] | select($weights[.check] == null)] as $unweighted
                | reduce ($weighted | sort_by(-.weight)[]) as $check (
                    [range(1; 7) | {shard: ., weight: 0, checks: []}];
                    (map(.weight) | min) as $minimum
                    | (map(.weight == $minimum) | index(true)) as $index
                    | .[$index].weight += $check.weight
                    | .[$index].checks += [".#checks.x86_64-linux.\($check.check)"]
                  )
                | map(select(.checks | length > 0) | del(.weight)) as $balanced
                | if ($unweighted | length) > 0 then
                    $balanced + [{
                      shard: (($balanced | map(.shard) | max) + 1),
                      checks: [$unweighted[] | ".#checks.x86_64-linux.\(.check)"]
                    }]
                  else
                    $balanced
                  end
                | {include: .}
              '
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  check:
    needs: get-matrix
    name: Check shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-matrix.outputs.check-matrix) }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check
        run: nix build -L ${{ join(matrix.checks, ' ') }}
