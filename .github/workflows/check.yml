name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run Rust checks
        run: |
          nix develop --command bash -euo pipefail -c '
            cargo fmt --check
            cargo clippy --all-targets -- --deny warnings
            cargo test
          '

  get-matrix:
    name: Get matrix
    runs-on: ubuntu-latest
    outputs:
      check-matrix: ${{ steps.set-check-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@main
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - id: set-check-matrix
        run: |
          matrix="$(
            nix eval --json .#check-matrix.x86_64-linux |
              jq -c '
                [.include[] | select(.check != "clippy" and .check != "rustfmt")] as $checks
                # Full VM test-script seconds measured in CI run 33373569579.
                | {
                    "activation-modes": 762.60,
                    "file-mode-with-flake-capable-nix": 894.60,
                    "flake-build-with-flakes-disabled-in-config": 591.93,
                    "flake-remote-build-with-flakes-disabled-in-config": 748.07,
                    "hyphen-ssh-opts-regression": 484.96,
                    "local-build": 629.94,
                    "multi-host-scenarios": 917.45,
                    "options-overriding": 752.40,
                    "profile": 638.22,
                    "remote-build": 630.09,
                    "rollback-scenarios": 936.87,
                    "ssh-multiplexing": 810.69,
                    "ssh-rollback": 835.54
                  } as $weights
                | ["deploy-rx", "reuse", "transform-deploy"] as $lightChecks
                | [$checks[] | select($weights[.check] != null) | . + {weight: $weights[.check]}] as $weighted
                | [
                    $checks[]
                    | . as $check
                    | select($lightChecks | index($check.check))
                  ] as $light
                | [
                    $checks[]
                    | . as $check
                    | select(
                        $weights[$check.check] == null
                        and ($lightChecks | index($check.check) | not)
                      )
                  ] as $unweighted
                | (($weighted | length) / 2 | ceil) as $shardCount
                | reduce ($weighted | sort_by(-.weight)[]) as $check (
                    [range(1; $shardCount + 1) | {shard: ., weight: 0, checks: []}];
                    ([
                      to_entries[]
                      | select(.value.checks | length < 2)
                    ] | min_by(.value.weight) | .key) as $index
                    | .[$index].weight += $check.weight
                    | .[$index].checks += [".#checks.x86_64-linux.\($check.check)"]
                  )
                | (map(.weight) | min) as $minimum
                | (map(.weight == $minimum) | index(true)) as $lightest
                | .[$lightest].checks += [
                    $light[] | ".#checks.x86_64-linux.\(.check)"
                  ]
                | map(select(.checks | length > 0) | del(.weight)) as $balanced
                | if ($unweighted | length) > 0 then
                    $balanced + [{
                      shard: (($balanced | map(.shard) | max) + 1),
                      checks: [$unweighted[] | ".#checks.x86_64-linux.\(.check)"]
                    }]
                  else
                    $balanced
                  end
                | {include: .}
              '
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  check:
    needs: get-matrix
    name: Check shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-matrix.outputs.check-matrix) }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check
        run: nix build -L ${{ join(matrix.checks, ' ') }}
